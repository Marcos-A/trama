# Keep in sync with SECURITY_HEADERS in vite.config.ts.
# connect-src 'self' is the browser-enforced guarantee that recordings never leave the page.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
add_header Permissions-Policy "display-capture=(self), camera=(), microphone=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
